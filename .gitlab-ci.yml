stages:
  - build
  - upload
  - release
  - lint
  - test

variables:
  PACKAGE_REGISTRY_URL: "$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/$CI_PROJECT_NAME"
  PACKAGE_VERSION: "$CI_COMMIT_TAG"
  PACKAGE_NAME: "debian-updates-indicator-glerro.pm.me_$PACKAGE_VERSION.zip"
  EXT_PACKAGE_NAME: "debian-updates-indicator@glerro.pm.me.shell-extension.zip"

build:
  stage: build
  image: registry.gitlab.gnome.org/gnome/gnome-shell/fedora/35:2022-02-18.0
  rules:
    - if: $CI_COMMIT_TAG
  script:
    # Export GS Extension
    - ./export_zip.sh
    # Rename the exported zip file
    - mv zip-files/$EXT_PACKAGE_NAME zip-files/$PACKAGE_NAME
    # Generate description from annotated tag's subject
    - mkdir descriptions
    - git tag --format="%(contents)" --list $CI_COMMIT_TAG | awk '{if ($1 != "-----BEGIN") {print $0;} else {exit} }' > descriptions/tag-description.txt
  artifacts:
    expire_in: 1 day
    paths:
     - zip-files/
     - descriptions/

upload:
  stage: upload
  image: curlimages/curl:latest
  rules:
    - if: $CI_COMMIT_TAG
  script:
    - 'curl --header "JOB-TOKEN: $CI_JOB_TOKEN" --fail --upload-file zip-files/$PACKAGE_NAME $PACKAGE_REGISTRY_URL/$PACKAGE_VERSION/$PACKAGE_NAME'

release-from-tag:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  rules:
    - if: $CI_COMMIT_TAG
  script:
    - echo "Creating a release for $CI_COMMIT_TAG"
    - export DESCRIPTION="$(cat descriptions/tag-description.txt)"
    - 'release-cli create --name "Release $CI_COMMIT_TAG" --description "$DESCRIPTION" --tag-name "$CI_COMMIT_TAG" --ref "$CI_COMMIT_SHA" --assets-link "{\"url\":\"$PACKAGE_REGISTRY_URL/$PACKAGE_VERSION/$PACKAGE_NAME\",\"name\":\"$PACKAGE_NAME\"}"'

eslint:
  stage: lint
  image: node:latest
  rules:
    - when: always
  script:
    - export NODE_PATH=$(npm root -g)
    - npm install -g eslint@^8.0.0
    - eslint --format junit --output-file eslint-report.xml .
  artifacts:
    reports:
      junit: eslint-report.xml
    when: always

sast:
  stage: test
include:
  - template: Security/SAST.gitlab-ci.yml
  - template: Security/Secret-Detection.gitlab-ci.yml

